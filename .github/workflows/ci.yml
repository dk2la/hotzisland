name: CI

# Runs on GitHub-hosted runners only: lint and security on Linux,
# build and tests on macOS.
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: swiftlint lint --quiet --reporter github-actions-logging

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - name: Workflow lint (actionlint)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Secret scan (gitleaks)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --no-banner --redact --config .gitleaks.toml

      - name: Security scan (semgrep)
        run: |
          pipx install semgrep==1.184.0
          semgrep scan --config p/swift --config p/secrets --metrics off --error Sources Tests

  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test
        run: ./run.sh --clean --test --no-run
