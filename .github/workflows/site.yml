name: Site

# Builds the website in site/ and deploys it to Cloudflare Workers as static
# assets. Runs on GitHub-hosted runners only.
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; let a running deploy finish.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run from another branch must not replace the live site.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public address of the site (repository variable). Makes the link
          # preview image URL absolute; empty until the address is known.
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4.161.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
