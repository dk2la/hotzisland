name: HotzIsland
options:
  bundleIdPrefix: com.dk2la
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  HotzIsland:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: HotzIsland
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Danila Kozlov"
        NSAppleEventsUsageDescription: "HotzIsland controls your music players (Spotify, Apple Music) to show and manage playback from the island."
        NSCalendarsUsageDescription: "HotzIsland shows your upcoming events in the island."
        NSCalendarsFullAccessUsageDescription: "HotzIsland shows your upcoming events in the island."
        NSMicrophoneUsageDescription: "HotzIsland records audio only while you dictate a note."
        NSSpeechRecognitionUsageDescription: "HotzIsland transcribes your dictation into note text."
    # Signing lives in the xcconfig: ad-hoc by default, overridable by a
    # gitignored Signing.local.xcconfig (stable cert → keychain stops asking).
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dk2la.hotzisland
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets:
        - HotzIslandTests

  # Logic-only bundle: it compiles the pure mail parsing sources into itself,
  # so the tests need no app host and never touch Keychain or the network.
  HotzIslandTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    sources:
      - path: Tests
      - path: Sources/Modules/Email/IMAPParser.swift
      - path: Sources/Modules/Email/MIMEDecode.swift
      - path: Sources/Modules/Email/MailComposer.swift
      - path: Sources/Modules/Email/EmailModels.swift
      - path: Sources/Modules/Assistant/OpenAIClient.swift
      - path: Sources/Modules/Assistant/AssistantModels.swift
      - path: Sources/Modules/Assistant/CLIAssistantClient.swift
      - path: Sources/Services/SpeechCaptureService.swift
      - path: Sources/Core/WidgetGeometry.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dk2la.hotzisland.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
