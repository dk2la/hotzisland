name: Pocket
options:
  bundleIdPrefix: com.dk2la
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Pocket:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Danila Kozlov"
        NSAppleEventsUsageDescription: "Pocket controls your music players (Spotify, Apple Music) to show and manage playback from the widget."
        NSCalendarsUsageDescription: "Pocket shows your upcoming events in the widget."
        NSCalendarsFullAccessUsageDescription: "Pocket shows your upcoming events in the widget."
        NSMicrophoneUsageDescription: "Pocket records audio only while you dictate a note."
        NSSpeechRecognitionUsageDescription: "Pocket transcribes your dictation into note text."
    # Signing lives in the xcconfig: ad-hoc by default, overridable by a
    # gitignored Signing.local.xcconfig (stable cert → keychain stops asking).
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dk2la.pocket
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets:
        - PocketTests

  # Logic-only bundle: it compiles the pure mail parsing sources into itself,
  # so the tests need no app host and never touch Keychain or the network.
  PocketTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    sources:
      - path: Tests
      - path: Sources/Modules/Email/IMAPParser.swift
      - path: Sources/Modules/Email/MIMEDecode.swift
      - path: Sources/Modules/Email/MailComposer.swift
      - path: Sources/Modules/Email/EmailModels.swift
      - path: Sources/Modules/Assistant/OpenAIClient.swift
      - path: Sources/Modules/Assistant/AssistantModels.swift
      - path: Sources/Modules/Assistant/CLIAssistantClient.swift
      - path: Sources/Services/SpeechCaptureService.swift
      - path: Sources/Core/WidgetGeometry.swift
      - path: Sources/Modules/Email/EmailHTMLSanitizer.swift
      - path: Sources/Modules/Email/MailTransport.swift
      - path: Sources/Modules/Email/IMAPClient.swift
      - path: Sources/Modules/Email/MailSession.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dk2la.pocket.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
