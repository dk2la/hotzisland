name: HotzIsland
options:
  bundleIdPrefix: com.dk2la
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  HotzIsland:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: HotzIsland
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Danila Kozlov"
        NSAppleEventsUsageDescription: "HotzIsland controls your music players (Spotify, Apple Music) to show and manage playback from the island."
        NSCalendarsUsageDescription: "HotzIsland shows your upcoming events in the island."
        NSCalendarsFullAccessUsageDescription: "HotzIsland shows your upcoming events in the island."
        NSMicrophoneUsageDescription: "HotzIsland records audio only while you dictate a note."
        NSSpeechRecognitionUsageDescription: "HotzIsland transcribes your dictation into note text."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dk2la.hotzisland
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
